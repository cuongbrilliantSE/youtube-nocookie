[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/search/facebook"
  to = "/.netlify/functions/search-facebook"
  status = 200

[[redirects]]
  from = "/api/thumbnail"
  to = "/.netlify/functions/thumbnail"
  status = 200

[[redirects]]
  from = "/api/channel"
  to = "/.netlify/functions/channel"
  status = 200

[[redirects]]
  from = "/api/proxy-image"
  to = "/.netlify/functions/proxy-image"
  status = 200
